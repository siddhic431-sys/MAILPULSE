services:
  # MailPulse Express API Web Service
  - type: web
    name: mailpulse-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma db push
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mailpulse-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mailpulse-redis
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: mailpulse-web
          property: url
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

  # MailPulse BullMQ Background Worker
  - type: worker
    name: mailpulse-worker
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mailpulse-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mailpulse-redis
          property: connectionString

  # MailPulse Frontend Static Site
  - type: web
    name: mailpulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mailpulse-api
          property: url

  # MailPulse Managed Redis
  - type: redis
    name: mailpulse-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: mailpulse-postgres
    plan: free
    region: oregon
    databaseName: mailpulse_db
    user: mailpulse
